databaseChangeLog:
  - changeSet:
      id: 9-create-orders-table
      author: kahn_huseynov
      changes:
        - createTable:
            tableName: orders
            columns:
              - column: { name: id, type: bigint, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: user_id, type: bigint, constraints: { nullable: false } }
              - column: { name: status, type: varchar(30), constraints: { nullable: false } }
              - column: { name: shipping_address, type: varchar(500), constraints: { nullable: false } }
              - column: { name: total_price, type: "decimal(12, 2)", constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: orders
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_orders_user
            onDelete: RESTRICT
        - createIndex:
            tableName: orders
            indexName: idx_orders_user_id
            columns:
              - column: { name: user_id }
  - changeSet:
      id: 10-create-order-items-table
      author: kahn_huseynov
      changes:
        - createTable:
            tableName: order_items
            columns:
              - column: { name: id, type: bigint, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: order_id, type: bigint, constraints: { nullable: false } }
              - column: { name: product_id, type: bigint, constraints: { nullable: false } }
              - column: { name: product_name, type: varchar(150), constraints: { nullable: false } }
              - column: { name: unit_price, type: "decimal(12, 2)", constraints: { nullable: false } }
              - column: { name: quantity, type: int, constraints: { nullable: false } }
              - column: { name: subtotal, type: "decimal(12, 2)", constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: order_items
            baseColumnNames: order_id
            referencedTableName: orders
            referencedColumnNames: id
            constraintName: fk_order_items_order
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: order_items
            baseColumnNames: product_id
            referencedTableName: products
            referencedColumnNames: id
            constraintName: fk_order_items_product
            onDelete: RESTRICT
        - createIndex:
            tableName: order_items
            indexName: idx_order_items_order_id
            columns:
              - column: { name: order_id }
